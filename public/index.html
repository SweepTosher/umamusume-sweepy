<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>SWEEPY改三</title>
    <link rel="icon" type="image/png" href="/sweepy2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pre-login">
    <div id="loading-screen" class="loading-screen" role="status" aria-label="Loading">
        <div class="loading-plate">
            <h1 class="loading-word">Sweepy<span>改三</span></h1>
            <p class="loading-status">Connecting<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></p>
        </div>
    </div>

    <div id="app">
        <div class="hem" aria-hidden="true"></div>

        <header class="keybar">
            <label for="key-input" class="keybar-label">API key</label>
            <span class="buckle-frame key-buckle">
                <input id="key-input" class="key-input" type="password" spellcheck="false" autocomplete="off" placeholder="Paste your API key">
            </span>
            <button id="key-save-btn" class="btn btn-brass" type="button">SAVE</button>
            <span id="key-status-badge" class="runner-state is-idle" aria-live="polite">NO KEY</span>
            <span id="key-feedback" class="inline-feedback" aria-live="polite"></span>
            <a id="key-link" class="key-link" href="https://mayano.top/sweepy" target="_blank" rel="noreferrer" title="Open mayano.top/sweepy to generate your API key">Get an API key<span class="key-link-arrow" aria-hidden="true">↗</span></a>
            <span class="keybar-end">
                <button id="logout-btn" class="btn btn-sm btn-quiet logout-btn" type="button">LOG OUT</button>
            </span>
        </header>

        <main class="main">
            <section id="login-view" class="login" aria-label="Sign in">
                <div class="login-stage">
                    <figure class="login-art">
                        <img src="/sweepy3.webp" alt="Sweep Tosho">
                    </figure>
                    <div class="login-card">
                        <div id="qr-svg-box" class="qr-svg-box"></div>
                        <p id="qr-hint" class="qr-hint" aria-live="polite"></p>
                        <button id="qr-refresh-btn" class="btn btn-vermilion" type="button">REFRESH QR</button>
                        <div id="auth-error-msg" class="banner error status-msg" role="alert"></div>
                    </div>
                </div>
                <div class="hem login-hem" aria-hidden="true"></div>
            </section>

            <section id="dashboard-view" class="dashboard" aria-label="Dashboard">
                <section class="career" aria-labelledby="career-name">
                    <div class="career-main">
                        <div class="live">
                            <p class="live-cell"><span class="label">Turn</span><strong id="hud-turn-val" class="live-value">— / 78</strong></p>
                            <span id="hud-runner-badge" class="runner-state" aria-live="polite"></span>
                        </div>
                        <h1 id="career-name" class="career-name is-placeholder">NO ACTIVE CAREER</h1>
                        <p id="exec-status-line" class="exec-status-line" aria-live="polite"></p>
                        <div class="actions">
                            <button id="run-career-btn" class="btn btn-vermilion" type="button" disabled>RESUME</button>
                            <button id="stop-career-btn" class="btn btn-quiet" type="button" disabled>STOP</button>
                            <button id="final-turn-export-btn" class="btn btn-brass" type="button" style="display: none">umaDump</button>
                            <button id="tempt-fate-btn" class="btn btn-quiet toggle" type="button" role="switch" aria-checked="false">
                                <span>Tempt fate</span>
                                <span class="toggle-state" aria-hidden="true">Off</span>
                            </button>
                            <button id="burn-clocks-btn" class="btn btn-quiet toggle" type="button" role="switch" aria-checked="false">
                                <span>Burn clocks</span>
                                <span class="toggle-state" aria-hidden="true">Off</span>
                            </button>
                            <span class="delay">
                                <span class="label">Delay</span>
                                <input id="turn-delay-min" class="delay-input" type="number" min="0" max="60" step="0.1" value="1.6" aria-label="Minimum delay in seconds">
                                <span class="label" aria-hidden="true">–</span>
                                <input id="turn-delay-max" class="delay-input" type="number" min="0" max="60" step="0.1" value="3.7" aria-label="Maximum delay in seconds">
                            </span>
                        </div>
                    </div>

                    <figure class="career-art">
                        <img src="/sweepy3.webp" alt="Sweep Tosho">
                    </figure>

                    <div class="ledger" aria-label="Career vitals">
                        <p class="stat"><span class="label">Speed</span><strong id="stat-val-spd">—</strong></p>
                        <p class="stat"><span class="label">Stamina</span><strong id="stat-val-sta">—</strong></p>
                        <p class="stat"><span class="label">Power</span><strong id="stat-val-pwr">—</strong></p>
                        <p class="stat"><span class="label">Guts</span><strong id="stat-val-gut">—</strong></p>
                        <p class="stat"><span class="label">Wit</span><strong id="stat-val-wit">—</strong></p>
                        <p class="stat minor"><span class="label">SP</span><strong id="stat-val-sp">—</strong></p>
                        <p class="stat minor"><span class="label">Fans</span><strong id="stat-val-fans">—</strong></p>
                        <div class="hp">
                            <p class="hp-head"><span class="label">Energy</span><strong id="hud-hp-text">— / —</strong></p>
                            <div class="bar"><div id="hud-hp-fill" class="bar-fill hp-fill" style="width: 0%"></div></div>
                        </div>
                    </div>

                    <div class="hem career-hem" aria-hidden="true"></div>
                </section>

                <section class="grand-live" aria-labelledby="gl-title">
                    <div class="panel-head">
                        <div class="sechead">
                            <span class="num">02</span>
                            <span class="lbl" id="gl-title">Overview</span>
                            <span class="rule"></span>
                        </div>
                        <p class="mood"><span class="label">Mood</span><strong id="hud-mood-badge" class="mood-badge mood-normal">—</strong></p>
                    </div>
                    <div class="points">
                        <div class="point"><span class="point-code">DA</span><div class="bar"><div id="tok-fill-da" class="bar-fill" style="width: 0%"></div></div><strong id="tok-val-da">—</strong></div>
                        <div class="point"><span class="point-code">PA</span><div class="bar"><div id="tok-fill-pa" class="bar-fill" style="width: 0%"></div></div><strong id="tok-val-pa">—</strong></div>
                        <div class="point"><span class="point-code">VO</span><div class="bar"><div id="tok-fill-vo" class="bar-fill" style="width: 0%"></div></div><strong id="tok-val-vo">—</strong></div>
                        <div class="point"><span class="point-code">VI</span><div class="bar"><div id="tok-fill-vi" class="bar-fill" style="width: 0%"></div></div><strong id="tok-val-vi">—</strong></div>
                        <div class="point"><span class="point-code">ME</span><div class="bar"><div id="tok-fill-me" class="bar-fill" style="width: 0%"></div></div><strong id="tok-val-me">—</strong></div>
                    </div>
                    <div class="career-progress">
                        <div class="progress-head">
                            <span class="label">Turn</span>
                            <strong id="gl-turn" class="progress-count">0 / 78</strong>
                        </div>
                        <div class="bar"><div id="gl-turn-fill" class="bar-fill" style="width: 0%"></div></div>
                    </div>
                </section>

                <section class="log" aria-labelledby="log-title">
                    <div class="panel-head">
                        <div class="sechead">
                            <span class="num">03</span>
                            <span class="lbl" id="log-title">Log</span>
                            <span class="rule"></span>
                        </div>
                        <p class="hud-stat-pill">CLOCKS <strong id="hud-clocks-used">0</strong></p>
                    </div>
                    <p id="hud-last-action" class="last-action" aria-live="polite"></p>
                    <div id="hud-result-banner" class="banner result" role="status" style="display:none"></div>
                    <div id="hud-error-banner" class="banner error" role="alert" style="display:none"></div>
                    <div id="turn-log-wrap" class="table-wrap" tabindex="0" role="region" aria-label="Turns">
                        <table class="log-table">
                            <tbody id="turn-log-tbody">
                                <tr class="log-empty-row">
                                    <td colspan="3">NO TURNS YET</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <div id="account-strip" class="account-strip" aria-label="Account" style="display:none"></div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
